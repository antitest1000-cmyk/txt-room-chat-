        </div>
    </div>

    <div class="settings-grid">

            <label>Target Room</label>
            <select id="roomSelect">

                <option value="sex-chat">Sex Chat</option>
                <option value="roleplay-chat">RolePlay Chat</option>

                <option value="cam-chat">Cam Chat</option>
            </select>
        </div>
        <div class="form-group">
            <label>Response Chance (%)</label>
            <input type="number" id="responseChance" value="40" min="1" max="100">
        </div>
    </div>

    <div class="bots-section">
        <div class="bots-header">
            <h2>Active Bots</h2>
            <button class="btn" id="btnAddBot">+ Add Bot</button>
        </div>
        <div class="bots-list" id="botsList">
            <!-- Bot cards generated here -->
        </div>
    </div>

    <!-- ── Bot Media Pool Section ── -->
    <div class="bots-section" style="margin-top: 20px;">
        <div class="bots-header">
            <h2>Bot Media Pool (Randomly posted by bots)</h2>
        </div>
        <div style="display:flex; gap:10px; margin-bottom: 15px;">
            <input type="text" id="mediaInput" placeholder="Paste image/video URL here..." style="flex:1; padding:10px; background:#1a1a1a; color:#fff; border:1px solid #333; border-radius:6px;">
            <button class="btn btn-primary" onclick="addMedia()">Add Media</button>
        </div>
        <div id="mediaList" style="display:flex; flex-direction:column; gap:8px;">
            <!-- Media items generated here -->
        </div>
    </div>

    <div class="logs-container" id="logsContainer">
        <div class="log-entry log-info">[System] AI Bot Engine ready. Click "Start Engine" to activate bots.</div>
    </div>
</div>

        <div class="form-group" style="margin-bottom: 15px;">

            <textarea id="botPersona" rows="4" placeholder="e.g. You are a 22yo college girl looking for fun chat..."></textarea>
        </div>
        <div class="modal-actions">
            <button class="btn" id="btnCancelBot">Cancel</button>
            <button class="btn btn-primary" id="btnSaveBot">Save Bot</button>
        </div>
    </div>
</div>

        log(`Presence ping — ${bots.length} bot(s) active in ${room}.`);

                // 15% chance to post media if available
                if (botMedia.length > 0 && Math.random() < 0.15) {
                    mediaUrl = botMedia[Math.floor(Math.random() * botMedia.length)];
                    log(`📸 ${bot.username} is posting media along with a spontaneous message...`);
                } else {
                    log(`${bot.username} sending a spontaneous message...`);
                }
                await generateAndSend(bot, room, null, null, [], prompt, mediaUrl);
            }
            scheduleSpontaneous(room);
        }, delay);
    }

    // ── Poll for replies ──
    async function pollChat() {
        if (!engineRunning) return;
        const room = getCurrentRoom();
        const bots = getBots();
        const botNames = bots.map(b => b.username);
        try {
            const res = await fetch(`${SCRIPT_URL}?action=getMessages&room=${encodeURIComponent(room)}`);
            const data = await res.json();
            if (!Array.isArray(data)) return;

            if (data.length > lastMessageCount) {
                const newMsgs = data.slice(lastMessageCount);
                lastMessageCount = data.length;

                const realMsgs = newMsgs.filter(m => !botNames.includes(m.username) && m.username !== '🛡️ SYSTEM');
                const botMsgs  = newMsgs.filter(m => botNames.includes(m.username));

                // Reply to real users
                if (realMsgs.length > 0) {
                    log(`${realMsgs.length} real user message(s) detected.`);
                    const chance = parseInt(document.getElementById('responseChance').value);
                    if (Math.random() * 100 <= chance) {
                        const bot = bots[Math.floor(Math.random() * bots.length)];
                        const lastMsg = realMsgs[realMsgs.length - 1];
                        log(`${bot.username} replying to ${lastMsg.username}...`);
                        setTimeout(() => generateAndSend(bot, room, lastMsg.username, lastMsg.message, data.slice(-6), null), 1500 + Math.random() * 2500);
                    }
                }

                // ── Bot-to-bot interaction ──
                // When a bot sends a message, another bot has a 40% chance to reply
                if (botMsgs.length > 0 && bots.length > 1) {
                    const lastBotMsg = botMsgs[botMsgs.length - 1];
                    if (Math.random() < 0.40) {
                        // Pick a DIFFERENT bot to reply
                        const otherBots = bots.filter(b => b.username !== lastBotMsg.username);
                        const replyBot = otherBots[Math.floor(Math.random() * otherBots.length)];
                        log(`<i class="fa-solid fa-robot"></i>↔️<i class="fa-solid fa-robot"></i> Bot-to-bot: ${replyBot.username} replying to ${lastBotMsg.username}...`);
                        const delay = 4000 + Math.random() * 6000; // 4-10s delay for realism
                        setTimeout(() => generateAndSend(replyBot, room, lastBotMsg.username, lastBotMsg.message, data.slice(-6), null), delay);
                    }
                }
            }
        } catch (e) {
            // silent
        }
    }

    // ── Core AI + send function ──
    async function generateAndSend(bot, room, replyToUser, replyToMessage, recentHistory, overridePrompt, attachedMediaUrl = '') {
        let systemPrompt;

        if (overridePrompt) {
            systemPrompt = `${bot.persona}\n\nYou are in a live chat room right now. ${overridePrompt} Do NOT use quotation marks. Reply in plain text only.`;
        } else {
            const history = recentHistory.map(m => `${m.username}: ${m.message}`).join('\n');
            systemPrompt = `${bot.persona}

You are in a live chat room. Keep replies VERY SHORT (1-2 sentences max). Speak casually, like a real person texting.
Do NOT use formal language. Do NOT use quotation marks. Reply in plain text only.
Do NOT introduce yourself again.

Recent chat:
${history}

Now reply naturally to ${replyToUser} who said: "${replyToMessage}"`;
        }

        try {
            const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${GROQ_API_KEY}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    model: 'qwen/qwen3.8-27b',
                    messages: [{ role: 'user', content: systemPrompt }],
                    temperature: 0.9,
                    max_tokens: 80
                })
            });

            const aiData = await res.json();
            if (aiData.choices && aiData.choices[0]) {
                let msg = aiData.choices[0].message.content.trim().replace(/^[""]|[""]$/g, '');
                log(`${bot.username}: "${msg}"`, 'info');
                fetch(SCRIPT_URL, {
                    method: 'POST', mode: 'no-cors',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ action: 'chat', room, username: bot.username, message: msg, mediaUrl: attachedMediaUrl })
                });
            } else if (aiData.error) {
                log(`Groq error: ${aiData.error.message}`, 'error');
            }
        } catch (e) {
            log(`API Error: ${e.message}`, 'error');
        }
    }

    // ── Autostart Logic ──
    if (urlParams.get('autostart') === 'true') {
        setTimeout(() => {
            if (!engineRunning) {
                log('Auto-starting engine from iframe...');
                startEngine();
            }
        }, 1000);
    }
</script>
