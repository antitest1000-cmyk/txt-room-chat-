<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caught Me | Contact & Feedback</title>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        .page-content { max-width: 600px; margin: 40px auto; padding: 40px; background: #1a1a1a; border-radius: 12px; color: #ddd; }
        .page-content h1 { color: #e8760a; margin-bottom: 20px; text-align: center; }
        .page-content p { margin-bottom: 20px; text-align: center; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-size: 14px; color: #bbb; }
        .form-group input, .form-group textarea { width: 100%; padding: 10px; background: #222; border: 1px solid #444; border-radius: 6px; color: #fff; font-family: inherit; }
        .submit-btn { width: 100%; padding: 12px; background: #e8760a; color: #fff; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        .submit-btn:hover { background: #d65922; }
    </style>
</head>
<body>
    <nav class="top-bar">
        <button class="menu-btn" onclick="window.location.href='index.html'">← Home</button>
        <div style="flex-grow: 1; text-align: center; color: white; font-weight: bold; font-size: 1.2rem;">Contact Us</div>
    </nav>
    <div style="padding-top: 60px; min-height: 100vh;">
        <div class="page-content">
            <h1>Feedback & Contact</h1>
            <p>Have a suggestion, found a bug, or need to reach our admin team? Fill out the form below.</p>
            
            <form onsubmit="event.preventDefault(); alert('Thank you for your feedback! Our team will review it shortly.'); window.location.href='index.html';">
                <div class="form-group">
                    <label>Name or Username</label>
                    <input type="text" required>
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" required>
                </div>
                <div class="form-group">
                    <label>Subject</label>
                    <select style="width: 100%; padding: 10px; background: #222; border: 1px solid #444; border-radius: 6px; color: #fff;">
                        <option>General Inquiry</option>
                        <option>Bug Report</option>
                        <option>Ban Appeal</option>
                        <option>Business / Partnership</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Message</label>
                    <textarea rows="5" required></textarea>
                </div>
                <button type="submit" class="submit-btn">Send Message</button>
            </form>
        </div>
    </div>
</body>
</html>
